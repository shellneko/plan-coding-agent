[project]
name = "plan-coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "langchain>=1.1.3",
    "langchain-core>=1.2.0",
    "langchain-openai>=1.1.3",
    "numpy>=2.3.5",
    "openai>=2.11.0",
    "openwakeword",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.4",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "unitree-sdk2py",
    "uvicorn>=0.51.0",
    "websockets>=15.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plan_coding_agent"]

[tool.uv.sources]
openwakeword = { git = "https://github.com/dscripka/openWakeWord" }
unitree-sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python" }
